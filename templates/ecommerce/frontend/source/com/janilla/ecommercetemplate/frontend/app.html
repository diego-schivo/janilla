<template id="account">
  <account-element class="main-child account" data-success="${success}" data-warning="${warning}"></account-element>
</template>

<template id="addresses">
  <addresses-element class="main-child account"></addresses-element>
</template>

<template id="checkout">
  <checkout-element class="main-child"></checkout-element>
</template>

<template id="confirm-order">
  <confirm-order data-guest-email="${guestEmail}" data-payment-intent="${paymentIntent}"></confirm-order>
</template>

<template id="create-account">
  <create-account></create-account>
</template>

<template id="find-order">
  <find-order></find-order>
</template>

<template id="login">
  <login-element class="main-child login" data-warning="${warning}"></login-element>
</template>

<template id="logout">
  <logout-element class="main-child" data-no-op="${noOp}"></logout-element>
</template>

<template id="order">
  <order-element class="main-child account" data-id="${id}"></order-element>
</template>

<template id="orders">
  <orders-element class="main-child account"></orders-element>
</template>

<template id="product">
  <product-element class="main-child page" data-time="${time}"></product-element>
</template>

<template id="search">
  <search-element data-query="${query}"></search-element>
</template>

<template id="shop">
  <shop-element class="main-child" data-query="${query}" data-category="${category}" data-sort="${sort}"></shop-element>
</template>

<template id="toaster">
  <toaster-element></toaster-element>
</template>
