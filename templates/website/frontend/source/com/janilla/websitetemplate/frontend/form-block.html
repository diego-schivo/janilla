<article>
  <!--${intro}-->
  <!--${form}-->
  <!--${confirmation}-->
</article>

<template id="intro">
  <section class="intro">
    <!--${introContent}-->
  </section>
</template>

<template id="form">
  <form>
    <!--${fields}-->
    <p>
      <button class="button primary">Submit</button>
    </p>
  </form>
</template>

<template id="field">
  <p>
    <label for="${name}">${label}</label>
    <!--${control}-->
  </p>
</template>

<template id="input">
  <input type="${type}" id="${name}" name="${name}" required="${required}" />
</template>

<template id="textarea">
  <textarea id="${name}" name="${name}" rows="3" required="${required}"></textarea>
</template>

<template id="confirmation">
  <section class="confirmation">
    <!--${confirmationMessage}-->
  </section>
</template>
